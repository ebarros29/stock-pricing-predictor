version: '3.8'

services:
  api:
    build: .
    container_name: stock-api
    ports:
      - "8000:8000"
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: stock-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: always

  grafana:
    image: grafana/grafana:10.0.0
    container_name: stock-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: always
